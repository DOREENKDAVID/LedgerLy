name: ledgerly_v3
description: "An AI-powered financial partner for SMEs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  http: ^1.0.0
  provider: ^6.0.5
  flutter_secure_storage: ^8.0.0
  flutter_svg: ^1.1.6
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/images/logos/logo.png
  - assets/images/logos/favicon_1.png
  - assets/images/onboarding_1.png
  - assets/images/onboarding_2.png
  - assets/images/onboarding_3.png
  - assets/icons/
  - assets/fonts/