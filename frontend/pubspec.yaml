name: ledgerly_v3
description: "An AI-powered financial partner for SMEs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  shared_preferences: ^2.2.2
  http: ^1.0.0
  provider: ^6.0.5
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  intl: ^0.20.2
  syncfusion_flutter_charts: ^33.1.44
  pdf: ^3.10.7
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ledgerly_logo.png
    - assets/images/logos/logo.png
    - assets/images/logos/favicon_1.png
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/icons/
    - assets/fonts/